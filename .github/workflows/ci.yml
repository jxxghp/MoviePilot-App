name: Multiplatform CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ssot-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify SSOT sync gate
        run: python3 tools/sync-all.py --check
      - name: Run Python tooling and fixture tests
        run: python3 -m unittest discover -s tools/tests
      - name: Rust format, clippy, and golden fixture tests
        working-directory: shared/core-rust
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  core-and-ios:
    needs: ssot-and-rust
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Swift core tests
        run: zsh tools/ios/test-core.sh
      - name: Build WidgetKit extension
        run: >-
          xcodebuild build
          -project ios/MoviePilot.xcodeproj
          -scheme MoviePilotWidgets
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: Build iOS simulator app
        run: >-
          xcodebuild build-for-testing
          -project ios/MoviePilot.xcodeproj
          -scheme MoviePilot
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO

  android:
    needs: ssot-and-rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust Android target & cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Build Rust Android core & APK
        run: bash tools/android/build-android.sh artifacts
