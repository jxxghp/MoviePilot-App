name: Release IPA

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build and verify unsigned device IPA
        run: bash scripts/build-ipa.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: MoviePilot-${{ env.RELEASE_VERSION }}-unsigned
          path: |
            artifacts/*.ipa
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite its assets.' >&2
            exit 1
          fi
          cp .github/RELEASE_NOTES.md "$RUNNER_TEMP/release-notes.md"
          printf '\n构建源码：[%s](https://github.com/%s/commit/%s)。\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "MoviePilot ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "artifacts/MoviePilot-${RELEASE_VERSION}-unsigned.ipa" artifacts/SHA256SUMS
