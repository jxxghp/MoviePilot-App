name: Multiplatform Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '需要同版本重建的现有 Release 标签'
        required: true
        type: string
        default: v2.0.2
      rebuild_existing:
        description: '确认更新该标签的源码、安装包和校验文件'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VER="${TAG#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          test "$VER" = "$FILE_VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - run: python3 tools/sync-all.py --check
      - working-directory: shared/core-rust
        run: cargo test --workspace

  build-ios:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/ios/build-ipa.sh "${{ needs.prepare.outputs.version }}" artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ios-artifacts
          path: artifacts/*.ipa

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - run: bash tools/android/build-android.sh artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: artifacts/*.apk

  publish-release:
    needs: [prepare, build-ios, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate unified SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "MoviePilot ${{ needs.prepare.outputs.version }}" \
              --notes-file .github/RELEASE_NOTES.md \
              release-assets/*
          fi
