[workspace]
resolver = "2"
members = [
  "crates/mp-core-model",
  "crates/mp-core-api",
  "crates/mp-core-session",
  "crates/mp-core-plugin",
  "crates/mp-ffi-uniffi",
  "crates/mp-ffi-ohos",
]

[workspace.package]
version = "2.0.13"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
url = "2.5"
base64 = "0.22"
uniffi = { version = "0.29", features = ["cli"] }

[profile.release]
lto = "thin"
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
