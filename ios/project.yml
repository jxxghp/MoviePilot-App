name: MoviePilot
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MoviePilotCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MOVIEPILOT_APNS_ENVIRONMENT: disabled
targets:
  MoviePilot:
    type: application
    platform: iOS
    sources:
      - path: MoviePilot
        excludes: [Resources/Info.plist]
    dependencies:
      - package: MoviePilotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.moviepilot.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: MoviePilot/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
    scheme:
      gatherCoverageData: true
      testTargets:
        - MoviePilotUITests
  MoviePilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoviePilotUITests
    dependencies:
      - target: MoviePilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.moviepilot.app.uitests
        GENERATE_INFOPLIST_FILE: true
