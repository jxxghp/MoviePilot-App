name: MoviePilot
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  MoviePilotCore:
    path: .
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: 3d0f0fa7031eab1a67c817c98a495e1c68fc998c
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 2.0.6
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MOVIEPILOT_APNS_ENVIRONMENT: production
targets:
  MoviePilot:
    type: application
    platform: iOS
    sources:
      - path: MoviePilot
        excludes: [Resources/Info.plist, Resources/CommunityMedals, Resources/PluginShell]
      # 勋章贴图按 `CommunityMedals/` 子目录从包内加载，必须以文件夹引用整体拷贝，不能平铺到包根目录。
      - path: MoviePilot/Resources/CommunityMedals
        type: folder
        buildPhase: resources
      # 本地联邦插件运行时壳（plugin-shell）需保留 `assets/` 子目录结构，以文件夹引用整体打入主包。
      - path: MoviePilot/Resources/PluginShell
        type: folder
        buildPhase: resources
      - path: NativeDesignSystem
    dependencies:
      - package: MoviePilotCore
      - package: MoviePilotCore
        product: MoviePilotSession
      - package: MoviePilotCore
        product: MoviePilotPluginForms
      # MPVKit-GPL 静态依赖必须排在动态框架 VLCKit 之前，避免 libmpv 的 libplacebo/FFmpeg/libass 符号被 VLCKit 劫持导致 ABI 冲突崩溃。
      - package: MPVKit
        product: MPVKit-GPL
      - package: VLCKit
      - target: MoviePilotWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moviepilot.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: MoviePilot/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: MoviePilot/Resources/APNs.entitlements
    scheme:
      gatherCoverageData: true
      testTargets:
        - MoviePilotUITests
  MoviePilotWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MoviePilotWidgets
        excludes: [Info.plist, Widgets.entitlements]
    dependencies:
      - package: MoviePilotCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moviepilot.app.widgets
        INFOPLIST_FILE: MoviePilotWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: MoviePilotWidgets/Widgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  MoviePilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoviePilotUITests
    dependencies:
      - target: MoviePilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moviepilot.app.uitests
        GENERATE_INFOPLIST_FILE: true
